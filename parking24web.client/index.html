<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <!-- 홈화면 아이콘 설정 -->
    <link rel="apple-touch-icon" href="/logo_extended.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo_extended.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo_extended.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/logo_extended.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EPSAI</title>
    
    <!-- PWA 매니페스트 -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- PWA 및 모바일 최적화 메타 태그 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EPSAI">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="msapplication-navbutton-color" content="#1a1a2e">

    <!-- 여기 추가 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            font-family: 'Noto Sans KR', sans-serif !important;
        }
        
        /* 모바일/태블릿 주소창 숨기기 최적화 */
        html {
            height: 100%;
            overflow-x: hidden;
            /* 우주 테마 배경으로 통일 */
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        
        body {
            height: 100%;
            overflow-x: hidden;
            /* 우주 테마 배경으로 통일 */
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            margin: 0;
            padding: 0;
            /* 노치/상태바 영역까지 배경 확장 */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        
        /* iOS Safari 주소창 숨기기 */
        @supports (-webkit-touch-callout: none) {
            body {
                -webkit-overflow-scrolling: touch;
                position: fixed;
                width: 100%;
                height: 100%;
            }
        }
        
        /* 안드로이드 Chrome 주소창 숨기기 */
        @media screen and (max-width: 768px) {
            body {
                min-height: calc(100vh + 1px);
            }
        }
        
        /* 모바일 줌인 방지 - input 필드 폰트 크기 */
        input, textarea, select {
            font-size: 16px !important;
        }
        
        /* iOS Safari 줌인 방지 */
        input[type="text"], 
        input[type="password"], 
        input[type="email"], 
        input[type="tel"], 
        input[type="url"], 
        input[type="search"], 
        textarea, 
        select {
            font-size: 16px !important;
            transform: scale(1);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
